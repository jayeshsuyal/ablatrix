name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Qualification live CLI offline guards
        run: |
          node --import tsx --test scripts/grader-qualification-live.test.ts
          npx tsc --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target es2023 --strict --skipLibCheck scripts/grader-qualification-live.ts
      - name: Verify sealed grader qualification reproduction
        run: |
          qualification_seal="$PWD/docs/evidence/grader-qualification-2026-10-15/seal-v1"
          qualification_expected="$PWD/docs/evidence/grader-qualification-2026-10-15/offline-rehearsal-v1.json"
          qualification_commit="$(node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).implementationCommit; if(!/^[a-f0-9]{40}$/.test(c))throw Error("Invalid implementation commit"); process.stdout.write(c);' "$qualification_seal/plan.json")"
          qualification_checkout="$(mktemp -d /tmp/ablatrix-qualification-code.XXXXXX)"
          qualification_report="${qualification_checkout}-rehearsal.json"
          git clone --no-checkout --shared "$PWD" "$qualification_checkout"
          git -C "$qualification_checkout" checkout --detach "$qualification_commit"
          (
            cd "$qualification_checkout"
            npm ci
            npm run grader:qualification -- --verify --dir "$qualification_seal"
            npm run grader:qualification -- --rehearse --dir "$qualification_seal" --out "$qualification_report"
          )
          cmp "$qualification_expected" "$qualification_report"
      - name: Offline RAG and harness contracts
        run: npm run check:reliability -- --out /tmp/ablatrix-reliability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-reliability
          path: /tmp/ablatrix-reliability.json
          if-no-files-found: error
      - run: python3 -m unittest scripts/test_prepare_flat_source_cohort.py scripts/test_prepare_source_calibration_cohort.py scripts/test_prepare_retrieval_coverage_cohort.py scripts/test_prepare_source_gap_cohort.py scripts/test_prepare_source_gap_partial.py scripts/test_prepare_source_coverage_v2_deck.py scripts/test_replay_frozen_v2.py
      - name: First-answer comparison offline CLI and script types
        run: |
          node --import tsx scripts/source-calibration-comparison.ts
          node --import tsx scripts/retrieval-coverage-comparison.ts
          node --import tsx scripts/source-gap-comparison.ts
          node --import tsx scripts/source-gap-partial-comparison.ts
          node --import tsx --test scripts/source-gap-retrieval.test.ts
          node --import tsx --test scripts/source-coverage-v2-retrieval.test.ts
          node --import tsx scripts/source-coverage-v2-retrieval.ts
          node --import tsx scripts/source-coverage-v2-live.ts
          npx tsc --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target es2023 --strict --skipLibCheck scripts/source-calibration-retrieval.ts scripts/source-calibration-comparison.ts scripts/retrieval-coverage-retrieval.ts scripts/retrieval-coverage-comparison.ts scripts/source-gap-retrieval.ts scripts/source-gap-comparison.ts scripts/source-gap-partial-comparison.ts scripts/source-gap-retrieval.test.ts scripts/source-coverage-v2-retrieval.ts scripts/source-coverage-v2-retrieval.test.ts scripts/source-coverage-v2-live.ts
      - name: Retrieval diagnosis offline replay and mocked three-context workflow
        run: |
          python3 -m unittest scripts/test_source_packet_disjointness.py
          npm run diagnosis:replay
          npm run diagnosis:mock
          npm run diagnosis:rehearse-v5
          npm run diagnosis:qualify-v5
          npm run diagnosis:evaluate
          npm run diagnosis:v5 -- /tmp/ablatrix-v5-replay.json
          npm run diagnosis:live
          npx tsc --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target es2023 --strict --skipLibCheck scripts/retrieval-diagnosis.ts scripts/prepare-three-context.ts scripts/prepare-semantic-model.ts scripts/verify-retrieval-diagnosis.ts scripts/three-context-mock.ts scripts/qualify-three-context-v5.ts scripts/rehearse-three-context-v5.ts scripts/three-context-evaluation.ts scripts/retrieval-diagnosis-v4.ts scripts/retrieval-diagnosis-v5.ts scripts/prepare-three-context-v5.ts scripts/three-context-live.ts
      - name: Prospective validation source and review gates (synthetic fixtures only)
        run: |
          python3 -m unittest discover -s scripts -p 'test_prepare_fresh_validation_v1.py'
          python3 scripts/replay-prospective-v1.py
          npm run validation:mock
          npm run validation:contexts
          npm run validation:prepare
          npx tsc --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target es2023 --strict --skipLibCheck scripts/fresh-validation-contexts-v1.ts scripts/fresh-validation-mock.ts scripts/prepare-three-context-fresh-v1.ts server/fresh-validation-v1.ts
      - name: V6 uncertainty development and prospective v2 offline guards
        run: |
          python3 -m unittest scripts/test_replay_prospective_v1.py scripts/test_prepare_fresh_validation_v2.py
          python3 scripts/prepare-fresh-validation-v2.py metadata
          node --import tsx scripts/retrieval-diagnosis-v6.ts --verify docs/evidence/report-uncertainty-v6-2026-10-19/candidate-freeze-v1.json docs/evidence/report-uncertainty-v6-2026-10-19/development-result-v1.json
          node --import tsx scripts/prepare-report-calibration-v1.ts
          node --import tsx scripts/qualify-report-calibration-v1.ts
          node --import tsx scripts/report-calibration-mock.ts
          node --import tsx scripts/fresh-validation-contexts-v2.ts
          npx tsc --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target es2023 --strict --skipLibCheck scripts/retrieval-diagnosis-v6.ts scripts/prepare-report-calibration-v1.ts scripts/qualify-report-calibration-v1.ts scripts/report-calibration-mock.ts scripts/fresh-validation-contexts-v2.ts server/report-calibration-qualification.ts server/report-calibration-outcome.ts server/fresh-validation-v2.ts server/fresh-validation-v2.test.ts
      - name: Automatic source review and fresh v3 offline guards
        run: |
          python3 -m unittest scripts/test_prepare_fresh_validation_v3.py
          python3 scripts/prepare-fresh-validation-v3.py metadata
          node --import tsx scripts/automatic-source-review-v1.ts
          node --import tsx scripts/fresh-validation-contexts-v3.ts
          npx tsc --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target es2023 --strict --skipLibCheck scripts/automatic-source-review-v1.ts scripts/fresh-validation-contexts-v3.ts server/automatic-review-v1.ts
      - name: Workspace observability local preview guards
        run: |
          node --import tsx scripts/workspace-observability-preview-v1.ts
          npx tsc --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target es2023 --strict --skipLibCheck scripts/workspace-observability-preview-v1.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Isolated synthetic demo browser flow
        run: npm run test:demo
      - run: npm audit --audit-level=low
